name: Build

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1

      - name: Test
        run: dotnet test Jellyfin.Plugin.CoverArt.slnx -c Release